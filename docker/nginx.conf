# Don't log the container healthcheck.
map $request_uri $loggable {
    /healthz 0;
    default  1;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    server_tokens off;
    root /var/www/html;
    index index.php;
    client_max_body_size 1m;
    access_log /var/log/nginx/access.log combined if=$loggable;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    include /etc/nginx/security-headers.conf;

    # Clean URLs: /privacy-policy.php -> /privacy-policy, /index.php -> /
    # ($request_uri is the original request, so internal rewrites don't loop.)
    if ($request_uri ~ "^/index\.php(\?.*)?$") { return 301 /$1; }
    if ($request_uri ~ "^(/[^?]+)\.php(\?.*)?$") { return 301 $1$2; }

    location = / {
        try_files /index.php =404;
        include /etc/nginx/php-fastcgi.conf;
    }

    location / {
        try_files $uri @clean_url;
    }

    # /privacy-policy -> /privacy-policy.php (internal rewrite; PHP-FPM handles it)
    location @clean_url {
        rewrite ^ $uri.php last;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include /etc/nginx/php-fastcgi.conf;
    }

    # Static assets. CSS URLs carry ?v=<mtime>, so long caching is safe.
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location = /favicon.ico { return 301 /favicon.svg; }

    # Block dotfiles, but allow /.well-known/ (ACME, verification files).
    location ~ /\.(?!well-known) { return 404; }

    error_page 403 404 /404.html;
    location = /404.html { internal; }
}
