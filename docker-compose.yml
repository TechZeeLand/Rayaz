services:
  php:
    build:
      context: .
      dockerfile: docker/Dockerfile.php
    image: rayaz-php:${IMAGE_TAG:-latest}
    container_name: ${PHP_CONTAINER_NAME:-rayaz-php}
    restart: unless-stopped
    environment:
      SITE_URL: ${SITE_URL:-https://rayaz.org}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - internal

  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile.nginx
    image: rayaz-web:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-rayaz-web}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-1030}:80"
    depends_on:
      php:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Goes through nginx -> PHP-FPM, so it tests the whole chain.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - internal

networks:
  internal:
    driver: bridge
