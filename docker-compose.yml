services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
      args:
        SERVER_NAME: ${SERVER_NAME:-_}
        CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-10m}
    image: rayaz-web:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-rayaz-web}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      php:
        condition: service_healthy
    environment:
      SERVER_NAME: ${SERVER_NAME:-_}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-10m}
    networks:
      - web

  php:
    image: php:8.3-fpm-alpine
    container_name: ${PHP_CONTAINER_NAME:-rayaz-php}
    restart: unless-stopped
    volumes:
      - ./index.php:/var/www/html/index.php:ro
      - ./privacy-policy.php:/var/www/html/privacy-policy.php:ro
      - ./terms-of-service.php:/var/www/html/terms-of-service.php:ro
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - web

networks:
  web:
    driver: bridge
